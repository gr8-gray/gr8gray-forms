name = "gr8gray-forms"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Custom domain the site's contact form posts to (see gr8gray-site Contact.astro —
# PUBLIC_FORMS_ORIGIN defaults to this host). custom_domain = true makes the deploy
# create the DNS record + cert in the gr8gray.dev zone automatically. Without this
# block the Worker only existed at workers.dev and every production form submission
# NXDOMAIN'd — the lead funnel was silently down until 2026-07-28.
routes = [
  { pattern = "forms.gr8gray.dev", custom_domain = true }
]

# Bind the audit-log KV namespace before deploy:
#   npx wrangler kv namespace create FORM_LOG
# Paste the returned id below.
[[kv_namespaces]]
binding = "FORM_LOG"
id = "bd6e1c49ae0b43b2b48e98372c121ee4"

# Secrets (set via `npx wrangler secret put <name>`):
#   BREVO_API_KEY         Brevo API key (xkeysib-...)
#   TURNSTILE_SECRET_KEY  Cloudflare Turnstile server-side key
#   NOTIFY_TO             email address to forward submissions to
#   NOTIFY_FROM           sender address (must be on verified Brevo domain)
