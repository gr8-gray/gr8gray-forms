name = "gr8gray-forms"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# forms.gr8gray.dev custom domain: ATTACHED 2026-07-28 via a one-time routes block
# ({ pattern = "forms.gr8gray.dev", custom_domain = true }) — the attachment is
# persistent Cloudflare account state. The block was then REMOVED because on
# re-deploys wrangler reconciles existing domains via the zone-routes API, and the
# CI token (CLOUDFLARE_API_TOKEN secret) lacks zone scope → Authentication error
# 10000, blocking every deploy after the first. If the domain ever detaches:
# re-add the block and run one deploy with a zone-scoped token, then remove again
# (or permanently upgrade the CI token with Zone > Workers Routes for gr8gray.dev
# and keep the block — the config-as-code ideal).

# Bind the audit-log KV namespace before deploy:
#   npx wrangler kv namespace create FORM_LOG
# Paste the returned id below.
[[kv_namespaces]]
binding = "FORM_LOG"
id = "bd6e1c49ae0b43b2b48e98372c121ee4"

# Secrets (set via `npx wrangler secret put <name>`):
#   BREVO_API_KEY         Brevo API key (xkeysib-...)
#   TURNSTILE_SECRET_KEY  Cloudflare Turnstile server-side key
#   NOTIFY_TO             email address to forward submissions to
#   NOTIFY_FROM           sender address (must be on verified Brevo domain)
